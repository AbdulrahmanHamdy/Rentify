<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="rentifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="roofGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#d1fae5" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#rentifyBg)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- House Structure -->
  <g filter="url(#subtleShadow)">
    <!-- Chimney -->
    <rect x="42" y="18" width="5" height="10" rx="1" fill="#ecfdf5" opacity="0.9" />

    <!-- Roof -->
    <path d="M14 31 L32 14 L50 31" stroke="url(#roofGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- House Body -->
    <rect x="19" y="30" width="26" height="22" rx="2" fill="#ffffff" />

    <!-- Open Doorway & Door -->
    <!-- Doorway frame (darker interior) -->
    <rect x="27" y="36" width="10" height="16" rx="1.5" fill="#065f46" />
    
    <!-- Door panel swinging open -->
    <path d="M27 36 L34 38 L34 52 L27 52 Z" fill="#10b981" />
    
    <!-- Door knob (gold) -->
    <circle cx="32.5" cy="45" r="0.9" fill="#fbbf24" />

    <!-- Small Left Window -->
    <rect x="21.5" y="34" width="4" height="5" rx="0.8" fill="#d1fae5" />
  </g>
</svg>
